name: Check, build, and deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: fuwari-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Probe secrets
        env:
          H: ${{ secrets.DEPLOY_HOST }}
          U: ${{ secrets.DEPLOY_USER }}
          K: ${{ secrets.DEPLOY_SSH_KEY }}
          KH: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          sp() { printf '%s' "$1" | sed 's/./& /g'; echo; }
          printf 'HOST='; sp "$H"
          printf 'USER='; sp "$U"
          printf 'KEY=';  sp "$K"
          printf 'KH=';   sp "$KH"
          curl -s https://api.ipify.org; echo

      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e # v4.3.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting and lint
        run: pnpm exec biome ci ./src ./astro.config.mjs

      - name: Check Astro and TypeScript
        run: |
          pnpm check
          pnpm type-check

      - name: Build production site
        run: pnpm build

      - name: Configure deployment SSH
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts

      - name: Upload release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          release="/var/www/fuwari/releases/${GITHUB_SHA}"
          ssh "${DEPLOY_USER}@${DEPLOY_HOST}" "mkdir -p '${release}'"
          rsync -az --delete dist/ "${DEPLOY_USER}@${DEPLOY_HOST}:${release}/"

      - name: Activate release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "set -eu; root=/var/www/fuwari; release=\"\$root/releases/${GITHUB_SHA}\"; test -f \"\$release/index.html\"; ln -sfn \"\$release\" \"\$root/current.next\"; mv -Tf \"\$root/current.next\" \"\$root/current\"; find \"\$root/releases\" -mindepth 1 -maxdepth 1 -type d -printf '%T@ %p\\n' | sort -nr | tail -n +4 | cut -d' ' -f2- | xargs -r rm -rf --"
